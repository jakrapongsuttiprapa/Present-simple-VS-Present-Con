@property --p{syntax:"<number>";inherits:false;initial-value:0}
:root{
  --bg:#0b0820; --bg2:#14103a; --ink:#f4f1ff; --mute:#a9a3d6; --line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.1);
  --simple:#22d3ee; --cont:#ff3d77; --gold:#ffd166; --ok:#34d399; --bad:#ff5d73; --warn:#ffb020;
  --r:22px; --shadow:0 20px 60px -20px rgba(0,0,0,.7);
  --f:'Kanit','Sarabun','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif; --fd:'Bebas Neue','Kanit',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55}
body{overflow-x:hidden}
button,input,select{font-family:inherit;font-size:1rem}
button{cursor:pointer}
.hidden{display:none!important}
/* ---------- background ---------- */
#bgImg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-3;opacity:0;transition:opacity .8s}
#bgImg.on{opacity:1}
#bgImg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,8,32,.78),rgba(11,8,32,.92))}
.aurora{position:fixed;inset:-20%;z-index:-2;pointer-events:none;filter:blur(70px);opacity:.75}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;left:5%;top:5%;background:radial-gradient(circle,#2563eb 0,transparent 65%)}
.aurora i:nth-child(2){width:40vw;height:40vw;right:5%;top:20%;background:radial-gradient(circle,#ff3d77 0,transparent 65%);animation-duration:26s}
.aurora i:nth-child(3){width:50vw;height:50vw;left:30%;bottom:-5%;background:radial-gradient(circle,#06b6d4 0,transparent 65%);animation-duration:30s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-4vh) scale(1.15)}100%{transform:translate(-5vw,5vh) scale(.95)}}
.grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.floaters{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;bottom:-60px;font-family:var(--fd);letter-spacing:2px;color:rgba(255,255,255,.07);animation:rise linear infinite;white-space:nowrap}
@keyframes rise{to{transform:translateY(-120vh) rotate(8deg)}}
/* ---------- layout ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 90px}
.screen{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pad{padding:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--mute)}
.small{font-size:.86rem}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.2}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:600;color:#fff;background:var(--glass2);border:1px solid var(--line);transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,#ff3d77,#a855f7 55%,#22d3ee);background-size:200% 200%;animation:shift 6s ease infinite;box-shadow:0 10px 30px -10px #ff3d77}
.btn.gold{background:linear-gradient(135deg,#ffd166,#ff8a3d);color:#2a1600;box-shadow:0 10px 30px -10px #ffb020}
.btn.cyan{background:linear-gradient(135deg,#22d3ee,#3b82f6);box-shadow:0 10px 30px -10px #22d3ee}
.btn.danger{background:linear-gradient(135deg,#ff5d73,#c81e4a)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem;border-radius:10px}
.btn.big{font-size:1.15rem;padding:16px 28px;min-height:58px}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--glass2);border:1px solid var(--line)}
.pill.live{background:rgba(255,61,119,.15);border-color:rgba(255,61,119,.5);color:#ff9bb8}
.pill.loop{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.45);color:#9beefa}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cont);box-shadow:0 0 0 0 rgba(255,61,119,.7);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,61,119,0)}100%{box-shadow:0 0 0 0 rgba(255,61,119,0)}}
input.inp,select.inp{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}
input.inp:focus,select.inp:focus{border-color:var(--simple);box-shadow:0 0 0 4px rgba(34,211,238,.18)}
select.inp option{background:#1b1640;color:#fff}
label.lb{display:block;font-weight:600;margin:12px 0 6px;font-size:.92rem;color:#d9d4ff}
/* ---------- brand / hero ---------- */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:conic-gradient(from 200deg,#ff3d77,#a855f7,#22d3ee,#ff3d77);font-family:var(--fd);font-size:1.4rem;color:#fff;box-shadow:0 8px 24px -8px #a855f7;animation:spin 12s linear infinite}
.logo b{animation:spin 12s linear infinite reverse;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.brand .t1{font-family:var(--fd);font-size:1.35rem;letter-spacing:2px;line-height:1}
.brand .t2{font-size:.78rem;color:var(--mute)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:34px 26px 30px;margin-bottom:18px;border:1px solid var(--line);background:radial-gradient(120% 140% at 0% 0%,rgba(34,211,238,.25),transparent 55%),radial-gradient(120% 140% at 100% 100%,rgba(255,61,119,.3),transparent 55%),linear-gradient(160deg,#1b1450,#0e0a2a)}
.hero .kicker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hero h1{font-family:var(--fd);font-weight:400;font-size:clamp(2.6rem,8vw,5.4rem);letter-spacing:3px;line-height:.92;margin:0}
.hero h1 .s{color:var(--simple);text-shadow:0 0 30px rgba(34,211,238,.6)}
.hero h1 .c{color:var(--cont);text-shadow:0 0 30px rgba(255,61,119,.6)}
.hero h1 .amp{font-size:.55em;color:var(--gold);vertical-align:middle}
.hero .sub{margin-top:12px;font-size:1.05rem;color:#ddd8ff}
.hero .sub b{color:var(--gold)}
.timeline{position:relative;height:60px;margin-top:22px}
.timeline .ln{position:absolute;left:0;right:0;top:30px;height:3px;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.5),rgba(255,255,255,.1));border-radius:3px}
.timeline .tick{position:absolute;top:22px;width:18px;height:18px;border-radius:50%;background:var(--simple);box-shadow:0 0 14px var(--simple);animation:tickpop 3.2s ease-in-out infinite}
.timeline .now{position:absolute;top:8px;left:62%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.timeline .now .bar{width:4px;height:44px;border-radius:4px;background:var(--cont);box-shadow:0 0 18px var(--cont);animation:nowglow 1.2s ease-in-out infinite alternate}
.timeline .lbl{position:absolute;top:-2px;font-size:.72rem;font-weight:700;letter-spacing:1.5px}
@keyframes tickpop{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.1);opacity:1}}
@keyframes nowglow{to{box-shadow:0 0 34px var(--cont);transform:scaleY(1.12)}}
.hero .eq{position:absolute;right:20px;top:22px;display:flex;gap:4px;align-items:flex-end;height:40px}

.tbar{display:grid;grid-template-columns:170px 1fr 52px;gap:10px;align-items:center;font-size:.88rem;text-align:left;margin:7px 0}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(5,3,18,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .25s}

.warnbox{border-color:rgba(255,93,115,.6)!important;box-shadow:0 0 0 6px rgba(255,93,115,.15),var(--shadow)!important}

const errMsg = e => ERR[e] || ("เกิดข้อผิดพลาด: " + e);
async function api(action, data = {}, opt = {}) {
  if (!S.api) return { ok: false, error: "NO_API" };
  const tries = opt.tries || 1;
  for (let i = 0; i < tries; i++) {
    const ctl = window.AbortController ? new AbortController() : null;
    const to = setTimeout(() => ctl && ctl.abort(), opt.timeout || 30000);
    try {
      const res = await fetch(S.api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action }, data)), signal: ctl ? ctl.signal : undefined, redirect: "follow" });
      clearTimeout(to);
      const j = await res.json();
      return j;
    } catch (e) {
      clearTimeout(to);
      if (i < tries - 1) await sleep(1200 * (i + 1));
    }
  }
  return { ok: false, error: "NETWORK" };
}

function ripple(e, el) {
  const r = el.getBoundingClientRect(), s = Math.max(r.width, r.height);
  const sp = document.createElement("span"); sp.className = "ripple";
  const x = (e.clientX || r.left + r.width / 2) - r.left - s / 2, y = (e.clientY || r.top + r.height / 2) - r.top - s / 2;
  sp.style.cssText = `width:${s}px;height:${s}px;left:${x}px;top:${y}px`;
  el.appendChild(sp); setTimeout(() => sp.remove(), 650);
}
function countUp(el, to, ms = 1400) {
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

let AC = null;
function beep(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { tap: [[520, .05]], ok: [[660, .09], [880, .12]], bad: [[220, .16], [170, .2]], win: [[523, .1], [659, .1], [784, .1], [1047, .25]], warn: [[880, .12], [440, .12], [880, .12]] }[type] || [[440, .1]];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type === "bad" || type === "warn" ? "sawtooth" : "triangle"; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); t += d * .9; });
  } catch (e) {}
}
/* ---------------- confetti ---------------- */
function confetti(ms = 3500) {
  const cv = $("#confetti"), cx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#22d3ee", "#ff3d77", "#ffd166", "#a855f7", "#34d399", "#fff"];
  const P = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, w: 6 + Math.random() * 8, h: 8 + Math.random() * 10, vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, r: Math.random() * 6, vr: -.2 + Math.random() * .4, c: cols[(Math.random() * cols.length) | 0] }));
  const end = performance.now() + ms;
  (function f(t) {
    cx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    if (t < end) requestAnimationFrame(f); else cx.clearRect(0, 0, cv.width, cv.height);
  })(performance.now());
}

/* ====================================================================
   ANTI-CHEAT
   ==================================================================== */
const Guard = {
  on: false, mode: null, count: 0, limit: 5, last: 0, blurT: null, baseW: 0, mo: null, splitFlag: false, onLimit: null,
  start(mode, startCount, onLimit) {
    const s = S.cfg.settings;
    this.mode = mode; this.count = startCount || 0; this.limit = Number(s.violationLimit) || 0; this.onLimit = onLimit;
    this.on = s.antiCheat === "on";
    document.body.classList.add("noselect");
    if (!this.on) return;
    this.baseW = Math.max(innerWidth, 1);
    document.addEventListener("visibilitychange", this.vis);
    window.addEventListener("blur", this.blur); window.addEventListener("focus", this.focus);
    window.addEventListener("resize", this.resize);
    ["copy", "cut", "paste", "contextmenu", "dragstart", "selectstart"].forEach(ev => document.addEventListener(ev, this.block, true));
    document.addEventListener("keydown", this.key, true);
    this.mo = new MutationObserver(ms => {
      const tr = ms.some(m => m.type === "characterData" || Array.from(m.addedNodes || []).some(n => n.nodeName === "FONT"));
      if (tr) this.hit("translate", "พบการแปลภาษาหน้าเว็บ");
    });
    const area = $("#qArea"); if (area) this.mo.observe(area, { characterData: true, childList: true, subtree: true });
    this.trCheck = setInterval(() => { const c = document.documentElement.className; if (/translated-(ltr|rtl)/.test(c)) this.hit("translate", "Google Translate"); }, 2500);
  },
  stop() {
    this.on = false; document.body.classList.remove("noselect");
    document.removeEventListener("visibilitychange", this.vis);
    window.removeEventListener("blur", this.blur); window.removeEventListener("focus", this.focus);
    window.removeEventListener("resize", this.resize);
    ["copy", "cut", "paste", "contextmenu", "dragstart", "selectstart"].forEach(ev => document.removeEventListener(ev, this.block, true));
    document.removeEventListener("keydown", this.key, true);
    if (this.mo) this.mo.disconnect(); clearInterval(this.trCheck); clearTimeout(this.blurT);
  },
  vis() { if (document.visibilityState === "hidden") Guard.hit("switch_app", "ออกจากหน้าสอบ/สลับแอป/สลับแท็บ"); },
  blur() { clearTimeout(Guard.blurT); Guard.blurT = setTimeout(() => { if (!document.hasFocus() && document.visibilityState === "visible") Guard.hit("leave_window", "คลิกออกนอกหน้าสอบ/เปิดหน้าต่างอื่น"); }, 2500); },
  focus() { clearTimeout(Guard.blurT); },
  resize() {
    const small = innerWidth < Guard.baseW * 0.7 && innerWidth < screen.width * 0.75;
    if (small && !Guard.splitFlag) { Guard.splitFlag = true; Guard.hit("split_screen", "แบ่งหน้าจอ/ย่อหน้าต่าง (" + innerWidth + "px)"); }
    if (!small) Guard.splitFlag = false;
  },
  block(e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") && e.type !== "contextmenu") return;
    e.preventDefault();
    if (e.type === "copy" || e.type === "paste" || e.type === "cut") toast("🚫 ห้ามคัดลอก/วาง ระหว่างสอบ", "bad", 1800);
  },
  key(e) {
    const k = (e.key || "").toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (k === "printscreen" || (e.metaKey && e.shiftKey && /[345s]/.test(k))) { e.preventDefault(); return Guard.hit("screenshot", "กดปุ่มจับภาพหน้าจอ"); }
    if (k === "f12" || (mod && e.shiftKey && /[ijc]/.test(k)) || (mod && /^[cvxpsua]$/.test(k))) { e.preventDefault(); toast("🚫 ปุ่มลัดนี้ถูกปิดระหว่างสอบ", "bad", 1600); }
  },
  async hit(type, detail) {
    if (!this.on) return;
    const now = Date.now(); if (now - this.last < 1800) return; this.last = now;
    this.count++; beep("warn");
    api("violation", authData({ mode: this.mode, type, detail }));
    const over = this.limit > 0 && this.count >= this.limit;
    const b = modal(`<div class="center"><div style="font-size:3.4rem">🚨</div><h2 style="color:var(--bad)">ตรวจพบการทำผิดกติกา!</h2><p>${esc(detail)}</p>
      <div class="stat" style="max-width:220px;margin:10px auto"><b style="color:var(--bad)">${this.count}${this.limit > 0 ? "/" + this.limit : ""}</b>ครั้ง</div>
      <p class="muted small">${over ? "ครบจำนวนที่กำหนด ระบบจะส่งคำตอบอัตโนมัติ" : "ระบบบันทึกส่งให้ครูแล้ว" + (this.limit > 0 ? ` · ครบ ${this.limit} ครั้ง ระบบจะส่งข้อสอบทันที` : "")}</p>
      <button class="btn primary" id="gBack">${over ? "ตกลง" : "กลับไปทำข้อสอบ"}</button></div>`, { cls: "warnbox" });
    $("#gBack", b).onclick = () => { closeModal(); if (over && this.onLimit) this.onLimit(); };
    if (over && this.onLimit) setTimeout(() => { if ($("#gBack")) { closeModal(); this.onLimit(); } }, 5000);
  }
};
Guard.vis = Guard.vis.bind(Guard); Guard.blur = Guard.blur.bind(Guard); Guard.focus = Guard.focus.bind(Guard); Guard.resize = Guard.resize.bind(Guard); Guard.block = Guard.block.bind(Guard); Guard.key = Guard.key.bind(Guard);

/* ====================================================================
   FACE SCAN
   ==================================================================== */
const Face = {
  stream: null, raf: null, good: 0, need: 6, t0: 0, detector: null,
  run(mode) {
    return new Promise(resolve => {
      this.resolve = resolve; this.mode = mode;
      render(brandBar() + `<div class="card pad center" style="max-width:640px;margin:0 auto">
        <span class="pill live"><span class="dot"></span> FACE CHECK</span>
        <h2 style="margin-top:10px">📷 สแกนใบหน้ายืนยันตัวตน</h2>
        <p class="muted small">มองตรงไปที่กล้อง ให้ใบหน้าอยู่ในกรอบวงรี อยู่ในที่มีแสงสว่าง<br>รูปนี้ส่งให้ครูโอ๊ตเท่านั้น เพื่อป้องกันการสวมรอย</p>
        <div class="scan"><video id="fv" playsinline muted autoplay></video><div class="oval" id="fo"></div><div class="line"></div><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div></div>
        <div class="scanprog"><i id="fp"></i></div>
        <p id="fs" style="font-weight:600">กำลังเปิดกล้อง…</p>
        <div class="row" style="justify-content:center"><button class="btn ghost" id="fCancel">ยกเลิก</button><button class="btn gold hidden" id="fManual">📸 ถ่ายรูปยืนยัน</button><button class="btn hidden" id="fRetry">🔄 ลองเปิดกล้องอีกครั้ง</button></div>
      </div>`);
      $("#fCancel").onclick = () => { this.stop(); resolve(false); };
      $("#fManual").onclick = () => this.capture("manual");
      $("#fRetry").onclick = () => this.open();
      this.open();
    });
  },
  async open() {
    $("#fRetry").classList.add("hidden");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return this.fail("อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับกล้อง (ต้องเปิดผ่าน https)");
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    } catch (e) {
      return this.fail(e && e.name === "NotAllowedError" ? "ไม่ได้รับอนุญาตให้ใช้กล้อง — กดไอคอนกล้อง/แม่กุญแจที่แถบที่อยู่ แล้วเลือก 'อนุญาต' (iPad: ตั้งค่า > Safari > กล้อง > อนุญาต)" : "เปิดกล้องไม่ได้: " + (e && e.name || e));
    }
    const v = $("#fv"); if (!v) return this.stop();
    v.srcObject = this.stream;
    try { await v.play(); } catch (e) {}
    this.good = 0; this.t0 = Date.now();
    if ("FaceDetector" in window) { try { this.detector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 2 }); } catch (e) { this.detector = null; } }
    this.cv = document.createElement("canvas"); this.cv.width = 80; this.cv.height = 60; this.cx = this.cv.getContext("2d", { willReadFrequently: true });
    $("#fs").textContent = "กำลังตรวจหาใบหน้า…";
    this.loop();
  },
  fail(msg) { this.stop(); const s = $("#fs"); if (s) { s.innerHTML = "⚠️ " + esc(msg); s.style.color = "var(--warn)"; } const r = $("#fRetry"); if (r) r.classList.remove("hidden"); },
  async check(v) {
    if (this.detector) {
      try { const f = await this.detector.detect(v); if (f.length === 1 && f[0].boundingBox.width > v.videoWidth * 0.18) return { ok: true }; return { ok: false, msg: f.length > 1 ? "พบหลายใบหน้า — ให้มีแค่เราคนเดียว" : "วางใบหน้าให้อยู่ในกรอบ" }; } catch (e) { this.detector = null; }
    }
    const w = 80, h = 60; this.cx.drawImage(v, 0, 0, w, h);
    const d = this.cx.getImageData(0, 0, w, h).data;
    let n = 0, sum = 0, sum2 = 0, skin = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = (x - w / 2) / (w * 0.27), dy = (y - h / 2) / (h * 0.41);
      if (dx * dx + dy * dy > 1) continue;
      const i = (y * w + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
      const Y = .299 * r + .587 * g + .114 * b, Cb = 128 - .168736 * r - .331264 * g + .5 * b, Cr = 128 + .5 * r - .418688 * g - .081312 * b;
      n++; sum += Y; sum2 += Y * Y; if (Cb >= 77 && Cb <= 127 && Cr >= 133 && Cr <= 173) skin++;
    }
    const mean = sum / n, sd = Math.sqrt(Math.max(0, sum2 / n - mean * mean)), ratio = skin / n;
    if (mean < 40) return { ok: false, msg: "แสงน้อยเกินไป 💡 หันหน้าเข้าหาแสง" };
    if (mean > 230) return { ok: false, msg: "แสงจ้าเกินไป" };
    if (ratio < 0.25 || sd < 10) return { ok: false, msg: "วางใบหน้าให้อยู่ในกรอบวงรี" };
    return { ok: true };
  },
  async loop() {
    const v = $("#fv"); if (!v || !this.stream) return;
    if (v.readyState >= 2 && v.videoWidth) {
      const r = await this.check(v);
      if (!$("#fv")) return this.stop();
      this.good = r.ok ? this.good + 1 : Math.max(0, this.good - 1);
      $("#fo").classList.toggle("good", r.ok);
      $("#fp").style.width = Math.min(100, this.good / this.need * 100) + "%";
      $("#fs").textContent = r.ok ? "พบใบหน้า ✅ อยู่นิ่งๆ สักครู่…" : r.msg;
      if (this.good >= this.need) return this.capture(this.detector ? "FaceDetector" : "auto");
      if (Date.now() - this.t0 > 15000) $("#fManual").classList.remove("hidden");
    }
    this.raf = setTimeout(() => this.loop(), 250);
  },
  async capture(method) {
    const v = $("#fv"); if (!v || !v.videoWidth) return toast("กล้องยังไม่พร้อม", "bad");
    clearTimeout(this.raf);
    const c = document.createElement("canvas"); c.width = 240; c.height = 180;
    const cx = c.getContext("2d");
    const vw = v.videoWidth, vh = v.videoHeight, sc = Math.max(240 / vw, 180 / vh);
    cx.drawImage(v, (240 - vw * sc) / 2, (180 - vh * sc) / 2, vw * sc, vh * sc);
    let img = c.toDataURL("image/jpeg", 0.6);
    if (img.length > 45000) img = c.toDataURL("image/jpeg", 0.35);
    beep("ok"); $("#fs").textContent = "📤 กำลังส่งรูปยืนยัน…";
    const r = await api("face", authData({ img, mode: this.mode, method }), { tries: 3 });
    this.stop();
    if (!r.ok) { toast(errMsg(r.error), "bad"); return this.fail(errMsg(r.error)); }
    $("#fs").textContent = "ยืนยันตัวตนสำเร็จ ✅"; $("#fp").style.width = "100%";
    await sleep(600);
    this.resolve(true);
  },
  stop() { clearTimeout(this.raf); if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } }
};

/* ====================================================================
   QUIZ ENGINE (shared by exam & remedial)

const Q = {
  mode: null, list: [], i: 0, ans: {}, reveal: {}, endsMs: 0, skew: 0, timerT: null, saveT: null, submitting: false, round: 0,
  lsKey() { return "pt_ans_" + this.mode + "_" + S.key + (this.mode === "remedial" ? "_" + this.round : ""); },
  mount() {

        <div class="row" style="gap:8px"><span class="pill" id="vPill" title="ทำผิดกติกา">🛡️ ${Guard.count}</span>${exam && this.endsMs ? `<div class="timer" id="timer">--:--</div>` : `<span class="pill" id="ansPill"></span>`}</div>
        <div class="prog"><i id="progBar"></i></div></div></div>
      <div class="qwrap"><div><div class="card qcard" id="qArea" translate="no"></div></div>
      <div><div class="card pad"><div class="row" style="justify-content:space-between"><b>ข้อสอบทั้งหมด</b><span class="small muted" id="navInfo"></span></div><div class="nav" id="navGrid" style="margin-top:10px"></div>
        <button class="btn ${exam ? "primary" : "gold"}" id="subBtn" style="width:100%;margin-top:14px">📮 ส่งข้อสอบ</button>
        <p class="muted small" style="margin-top:8px">${exam ? "เปลี่ยนคำตอบได้จนกว่าจะกดส่ง · หมดเวลาระบบส่งให้อัตโนมัติ" : "เลือกแล้วจะเฉลยทันที — อ่านคำอธิบายให้เข้าใจ"}</p></div></div></div>`);
    $("#subBtn").onclick = () => this.confirmSubmit();
    this.renderNav(); this.renderQ(true);
    if (exam && this.endsMs) { this.tick(); this.timerT = setInterval(() => this.tick(), 1000); }
  },
  tick() {
    const left = this.endsMs - (Date.now() + this.skew);
    const el = $("#timer"); if (!el) return;
    const s = Math.max(0, Math.floor(left / 1000));
    el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    el.classList.toggle("low", s <= 300);
    if (s === 300) toast("⏰ เหลือเวลา 5 นาที!", "bad");
    if (left <= 0) { clearInterval(this.timerT); this.submit(true, "หมดเวลา"); }
  },
  renderNav() {

      let c = this.ans[q.id] != null ? "ans" : "";
      if (this.mode === "remedial" && this.reveal[q.id]) c = this.ans[q.id] === q.a ? "r" : "w";
      return `<button class="${c} ${k === this.i ? "cur" : ""}" data-k="${k}">${k + 1}</button>`;
    }).join("");
    $$("button", g).forEach(b => b.onclick = () => { this.i = +b.dataset.k; this.renderQ(true); this.renderNav(); });
    const n = Object.keys(this.ans).filter(id => this.ans[id] != null).length;

  start(mode, data) {

        ${nm("remedialMinScore", "คะแนนขั้นต่ำต่อรอบแก้ตัว", "0 = ตอบครบ 30 ข้อก็นับ 1 ครั้ง", 0, 30)}
      </div></div>
      <div class="card pad" style="margin-top:16px"><h3>🖼️ รูปตกแต่งเว็บ (ลิงก์ postimg)</h3>
        <p class="hint">วิธีใช้: เข้า <b>postimages.org</b> → อัปโหลดรูป → คัดลอก <b>"Direct link"</b> (ขึ้นต้น <span class="code">https://i.postimg.cc/…</span> ลงท้าย .jpg/.png) มาวาง · วางโค้ด BBCode/HTML ได้ ระบบดึงลิงก์ให้เอง · เว้นว่าง = ใช้ภาพเคลื่อนไหวของระบบ</p>
        <div class="setgrid">
          <div><label class="lb">รูปปก (Cover) — แสดงหน้าเข้าสู่ระบบ</label><input class="inp" data-img="coverImg" value="${esc(s.coverImg)}" placeholder="https://i.postimg.cc/xxxx/cover.jpg">
            <div class="hint">📐 ขนาดแนะนำ <b>1600 × 900 px (16:9)</b> · ไฟล์ไม่เกิน 1 MB<br>ถ้าเจนรูปด้วย AI ให้สั่งอัตราส่วน 16:9 ใส่ข้อความ "Basic English Course · By T.OAT · Thanakhan-oomsin school" ได้เลย (รูปแสดงเต็ม ไม่ถูกครอบ)</div>
            <div class="imgprev" id="pv_coverImg">ไม่มีรูป</div></div>
          <div><label class="lb">รูปพื้นหลัง (Background) — ทั้งเว็บ</label><input class="inp" data-img="bgImg" value="${esc(s.bgImg)}" placeholder="https://i.postimg.cc/xxxx/bg.jpg">
            <div class="hint">📐 ขนาดแนะนำ <b>1920 × 1080 px (16:9)</b> · ไฟล์ไม่เกิน 1.5 MB<br>ระบบจะทำให้มืดลงอัตโนมัติเพื่อให้อ่านตัวหนังสือได้ — เลือกรูปโทนเข้ม/ลายไม่ยุ่ง จะสวยที่สุด</div>
            <div class="imgprev" id="pv_bgImg">ไม่มีรูป</div></div>
        </div></div>
      <div class="card pad" style="margin-top:16px"><h3>🔑 เปลี่ยนรหัส Admin</h3><div class="row"><input class="inp" id="newPin" type="password" inputmode="numeric" placeholder="รหัสใหม่ (ตัวเลข 4–8 หลัก) · เว้นว่าง = ไม่เปลี่ยน" style="max-width:340px"></div>
        <p class="hint">ลิงก์หน้าครู: เพิ่ม <span class="code">?admin=1</span> ท้ายลิงก์เว็บ หรือกดปุ่ม "ครูโอ๊ต (Admin)" ท้ายหน้า</p></div>
      <div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary big" id="saveSet">💾 บันทึกการตั้งค่า</button></div>`;
    $$("[data-img]").forEach(inp => { const upd = () => this.preview(inp); inp.addEventListener("input", upd); inp.addEventListener("paste", () => setTimeout(upd, 30)); upd(); });
    $("#saveSet").onclick = () => this.saveSet();
  },
  cleanImg(v) {
    v = String(v || "").trim(); if (!v) return "";
    const m = v.match(/\[img\]\s*(https?:\/\/[^\s\[]+)\s*\[\/img\]/i) || v.match(/src=["'](https?:\/\/[^"']+)["']/i) || v.match(/(https?:\/\/i\.postimg\.cc\/[^\s"'\[\]<>]+)/i) || v.match(/(https?:\/\/[^\s"'\[\]<>]+)/i);
    return m ? m[1] : v;
  },
  preview(inp) {
    const k = inp.dataset.img, pv = $("#pv_" + k), raw = inp.value, u = this.cleanImg(raw);
    if (u !== raw.trim() && u) inp.value = u;
    if (!u) { pv.style.backgroundImage = ""; pv.textContent = "ไม่มีรูป (ใช้ภาพของระบบ)"; return; }
    if (/^https?:\/\/(www\.)?postimg\.cc\//i.test(u) && !/i\.postimg\.cc/i.test(u)) { pv.style.backgroundImage = ""; pv.innerHTML = "⚠️ นี่คือลิงก์ <b>หน้าเว็บ</b> ไม่ใช่ลิงก์รูป<br>ให้คัดลอก <b>Direct link</b> (i.postimg.cc)"; return; }
    pv.textContent = "กำลังโหลด…";
    const im = new Image();
    im.onload = () => { pv.style.backgroundImage = `url("${u.replace(/"/g, "")}")`; const ratio = im.naturalWidth / im.naturalHeight; pv.innerHTML = `<span class="pill" style="background:rgba(0,0,0,.6)">${im.naturalWidth}×${im.naturalHeight}${Math.abs(ratio - 16 / 9) > 0.08 ? " ⚠️ ไม่ใช่ 16:9" : " ✅"}</span>`; };
    im.onerror = () => { pv.style.backgroundImage = ""; pv.textContent = "❌ โหลดรูปไม่ได้ ตรวจลิงก์อีกครั้ง"; };
    im.src = u;
  },
  async saveSet() {
    const set = {};
    $$("#admBody [data-k]").forEach(i => set[i.dataset.k] = i.type === "checkbox" ? (i.checked ? "on" : "off") : i.value.trim());
    $$("#admBody [data-img]").forEach(i => set[i.dataset.img] = this.cleanImg(i.value));
    for (const k of ["coverImg", "bgImg"]) if (set[k] && !/^https:\/\//i.test(set[k])) return toast("ลิงก์รูปต้องขึ้นต้นด้วย https://", "bad");
    const np = $("#newPin").value.trim();
    if (np) { if (!/^\d{4,8}$/.test(np)) return toast(errMsg("BAD_NEW_PIN"), "bad"); set.adminPin = np; }
    $("#saveSet").disabled = true;
    const r = await api("adminSave", { pin: S.pin, settings: set });
    $("#saveSet").disabled = false;
    if (!r.ok) return toast(errMsg(r.error), "bad");
    if (np) { S.pin = np; sessionStorageSet("pt_admin_pin", np); $("#newPin").value = ""; }
    Object.assign(this.data.settings, set); delete this.data.settings.adminPin;
    S.cfg.settings = Object.assign(S.cfg.settings || {}, set); delete S.cfg.settings.adminPin;
    applyImages(); beep("ok"); toast("บันทึกแล้ว ✅ (นักเรียนเห็นผลเมื่อรีเฟรชหน้า)", "good");
  },
  async renderLog() {
    $("#admBody").innerHTML = `<div class="card pad center muted">กำลังโหลด…</div>`;
    const r = await api("adminLogs", { pin: S.pin });
    if (!r.ok) return toast(errMsg(r.error), "bad");
    const lab = ev => /^VIOLATION/.test(ev) ? "🚨 " + ev.replace("VIOLATION:", "ผิดกติกา: ") : ev === "DEVICE_BLOCKED" ? "⛔ มีเครื่องอื่นพยายามเข้าชื่อนี้" : ev === "DEVICE_BOUND" ? "🔒 ผูกเครื่อง" : ev === "FACE_SCAN" ? "📷 สแกนหน้า" : ev === "SUBMIT" ? "📮 ส่งสอบ" : ev === "START" ? "▶️ เริ่มสอบ" : ev;
    $("#admBody").innerHTML = `<div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="Admin.renderLog()">🔄 รีเฟรช</button><span class="muted small">300 เหตุการณ์ล่าสุด (ดูทั้งหมดในชีท Logs)</span></div>
      <div class="tblwrap"><table class="t" style="min-width:760px"><thead><tr><th>เวลา</th><th>ชั้น</th><th>เลขที่</th><th>ชื่อ</th><th>โหมด</th><th>เหตุการณ์</th><th>รายละเอียด</th></tr></thead><tbody>
      ${r.rows.map(x => `<tr><td class="small">${esc(x[0])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td><td>${esc(x[4])}</td><td>${esc(x[5])}</td><td>${esc(lab(x[6]))}</td><td class="small muted">${esc(x[7])}</td></tr>`).join("") || `<tr><td colspan="7" class="center muted">ยังไม่มีเหตุการณ์</td></tr>`}</tbody></table></div>`;
  }
};
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function sessionStorageDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

window.addEventListener("beforeunload", e => { if (Q.mode && !Q.submitting && $("#qArea")) { e.preventDefault(); e.returnValue = ""; } });
boot();
</script>
</body>
</html>
